name: Renderer validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

concurrency:
  group: renderer-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Renderer validation
    runs-on: ubuntu-24.04
    container: ghcr.io/atrinik/linux-build:ubuntu-26.04@sha256:ab467b9573f7727a6ded9e6e0518fa87af68c340f73f03be41c192a98a34a633
    timeout-minutes: 40
    env:
      CARGO_HOME: /tmp/atrinik-renderer-cargo
      CARGO_TARGET_DIR: /tmp/atrinik-renderer-target
      TRIVY_CACHE_DIR: /tmp/atrinik-renderer-trivy
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate renderer contracts and release
        run: tools/validate.sh

      - name: Scan locked dependencies
        run: >-
          trivy fs --scanners vuln --severity HIGH,CRITICAL
          --exit-code 1 --ignore-unfixed .
