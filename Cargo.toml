[workspace]
members = [
  "crates/atrinik-render",
  "crates/atrinik-render-api",
  "crates/atrinik-render-resources",
  "crates/atrinik-render-sdl3",
  "crates/atrinik-render-testkit",
  "crates/atrinik-render-ui",
  "crates/atrinik-render-wgpu",
  "crates/atrinik-scene",
]
resolver = "3"

[workspace.package]
authors = ["The Atrinik Project"]
edition = "2024"
license = "MIT"
repository = "https://github.com/atrinik/renderer"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
atrinik-render-api = { path = "crates/atrinik-render-api", version = "=0.1.0" }
atrinik-render-resources = { path = "crates/atrinik-render-resources", version = "=0.1.0" }
atrinik-render-testkit = { path = "crates/atrinik-render-testkit", version = "=0.1.0" }
atrinik-render-ui = { path = "crates/atrinik-render-ui", version = "=0.1.0" }
atrinik-render-wgpu = { path = "crates/atrinik-render-wgpu", version = "=0.1.0" }
atrinik-scene = { path = "crates/atrinik-scene", version = "=0.1.0" }
bytemuck = { version = "=1.25.2", features = ["derive"] }
naga = { version = "=30.0.0", features = ["wgsl-in"] }
pollster = "=1.0.1"
sdl3 = { version = "=0.18.4", features = ["raw-window-handle", "use-pkg-config"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "dx12", "vulkan", "wgsl"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
